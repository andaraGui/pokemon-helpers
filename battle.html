<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Encontro atual</title>
    <link rel="stylesheet" href="pixel-theme.css">
    <link rel="stylesheet" href="components/nature-effect.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #14161c;
            color: #e8e9ee;
            font-family: 'Press Start 2P', 'Courier New', ui-monospace, monospace;
            padding: 14px;
            font-size: var(--pxl-fs-sm);
        }

        h2 {
            font-size: var(--pxl-fs-xs);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #9198ab;
            margin: 14px 0 6px;
            font-weight: 700;
        }

        h2:first-child {
            margin-top: 0;
        }

        .empty {
            color: #9198ab;
            font-size: var(--pxl-fs-sm);
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 4px 0;
            border-bottom: 1px solid #2e3240;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            color: #9198ab;
        }

        .value {
            font-weight: 700;
            text-align: right;
        }

        .value[data-level="high"] {
            color: #57c785;
        }

        .value[data-level="mid"] {
            color: #f7d02c;
        }

        .value[data-level="low"] {
            color: #e2637a;
        }

        .move {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
        }

        .pxl-hp {
            padding: 6px 0 10px;
        }
    </style>
</head>

<body>
    <h2><span class="pxl-pokeball" style="margin-right:6px;"></span>Encontro atual</h2>
    <div id="content">
        <p class="empty">Nenhum encontro capturado ainda. Entre em uma batalha selvagem.</p>
    </div>
    <script src="components/nature-effect.js"></script>
    <script src="battle.js"></script>
</body>

</html>
