<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Encontro atual</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #14161c;
            color: #e8e9ee;
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 14px;
            font-size: 13px;
        }

        h2 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #9198ab;
            margin: 14px 0 6px;
            font-weight: 700;
        }

        h2:first-child {
            margin-top: 0;
        }

        .empty {
            color: #9198ab;
            font-size: 12px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 4px 0;
            border-bottom: 1px solid #2e3240;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            color: #9198ab;
        }

        .value {
            font-weight: 700;
            text-align: right;
        }

        .move {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
        }

        .shiny {
            color: #ffb238;
        }
    </style>
</head>

<body>
    <h2>Encontro atual</h2>
    <div id="content">
        <p class="empty">Nenhum encontro capturado ainda. Entre em uma batalha selvagem.</p>
    </div>
    <script src="battle.js"></script>
</body>

</html>
